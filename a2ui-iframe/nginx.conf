# Cloud Run sends traffic to $PORT (8080). The page is embedded by Gemini
# Enterprise in an A2UI v0.9 IFrameUrl side-panel Canvas, so X-Frame-Options
# must NEVER be set.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Restrict which origins may embed the canvas (replaces X-Frame-Options,
    # which must never be set because Gemini Enterprise frames this page).
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.cloud.google.com https://*.google.com https://*.corp.google.com https://*.example.com" always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location /campaigns/ {
        try_files $uri $uri/ /campaigns/index.html /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
