[project]
name = "starter-agent"
version = "1.0.0"
description = "Starter AI Agent Service for Agentic GitOps Blueprint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "google-genai>=0.1.1",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
