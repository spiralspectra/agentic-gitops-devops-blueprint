server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Embedding configuration:
    # Do NOT set X-Frame-Options (DENY/SAMEORIGIN), as it breaks agent iframe embedding.
    # Allow frame embedding from authorized Google Cloud and enterprise domains:
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.google.com https://*.googleusercontent.com;" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Cloud Run and Load Balancer
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
