<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Interactive Canvas</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f8f9fa;
      color: #202124;
    }
    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(60,64,67,0.3);
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      color: #1a73e8;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      background-color: #e6f4ea;
      color: #137333;
      margin-bottom: 16px;
    }
    button {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background-color: #155724;
    }
    #log {
      margin-top: 16px;
      padding: 12px;
      background: #f1f3f4;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge" id="embed-status">Standalone Window</div>
    <h1>Agent Interactive Canvas</h1>
    <p>This canvas demonstrates safe bi-directional <code>postMessage</code> communication with embedding agent platforms.</p>
    <button id="action-btn">Send Action to Agent</button>
    <div id="log">Awaiting messages...</div>
  </div>

  <script>
    const statusBadge = document.getElementById('embed-status');
    const logBox = document.getElementById('log');
    const actionBtn = document.getElementById('action-btn');

    const isEmbedded = window.self !== window.top;
    if (isEmbedded) {
      statusBadge.textContent = 'Embedded Canvas';
      statusBadge.style.backgroundColor = '#e8f0fe';
      statusBadge.style.color = '#1a73e8';
    }

    function appendLog(msg) {
      const line = document.createElement('div');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // Listen for messages from parent window
    window.addEventListener('message', (event) => {
      appendLog(`Received message from: ${event.origin}`);
      if (event.data && event.data.type === 'AGENT_UPDATE') {
        appendLog(`Agent update payload: ${JSON.stringify(event.data.payload)}`);
      }
    });

    // Dispatch action to parent window
    actionBtn.addEventListener('click', () => {
      const message = {
        type: 'agent_action',
        action_name: 'CANVAS_ACTION',
        payload: {
          timestamp: Date.now(),
          action: 'USER_SUBMIT_CONFIRMATION'
        }
      };
      if (window.parent) {
        window.parent.postMessage(message, '*');
        appendLog('Dispatched agent_action to parent window.');
      }
    });
  </script>
</body>
</html>
