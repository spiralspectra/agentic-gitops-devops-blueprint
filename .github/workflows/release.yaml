name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'agents/**'
      - 'deployment/**'
      - 'frontend/**'
      - '.github/workflows/release.yaml'
      - '!**/*.md'
      - '!agents/**/deployment_metadata.json'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Apply infrastructure and run gates, but skip agent deployment"
        type: boolean
        default: false

concurrency:
  group: release-production
  cancel-in-progress: false

# Least privilege: empty root permissions; each job declares what it needs.
permissions: {}

env:
  AGENTS_CLI_VERSION: "1.11.0"
  TERRAFORM_VERSION: "1.11.4"
  PYTHON_VERSION: "3.12"
  LOCUST_VERSION: "2.31.1"
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'your-gcp-project-id' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  changes:
    name: changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      terraform: ${{ steps.filter.outputs.terraform }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            agent:
              - 'agents/**'
              - '.github/workflows/release.yaml'
            terraform:
              - 'deployment/**'
            frontend:
              - 'frontend/**'

  terraform-apply:
    name: terraform-apply
    permissions:
      contents: read
      id-token: write
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      applied: ${{ steps.plan.outputs.changes }}
      logs_bucket_name: ${{ steps.outputs.outputs.logs_bucket_name }}
      reasoning_engine_name: ${{ steps.outputs.outputs.reasoning_engine_name }}
      reasoning_engine_id: ${{ steps.outputs.outputs.reasoning_engine_id }}
    defaults:
      run:
        working-directory: deployment/terraform/single-project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (Deployer Identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT || vars.DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt / init / validate
        run: |
          terraform fmt -check -recursive -diff ..
          terraform init -input=false -no-color
          terraform validate -no-color

      - name: terraform plan (detect changes and drift)
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -var-file=vars/env.tfvars \
            -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          {
            echo "## terraform plan (single-project)"
            if [ "$code" = "0" ]; then echo "No infrastructure changes - apply skipped."; fi
            if [ "$code" = "2" ]; then echo "**Applying the following infrastructure changes:**"; fi
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "1" ]; then exit 1; fi
          echo "changes=$([ "$code" = "2" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Guard plan against destructive actions
        if: steps.plan.outputs.changes == 'true'
        env:
          TF_ALLOW_DESTROY: ${{ vars.TF_ALLOW_DESTROY }}
        run: |
          terraform show -json tfplan > tfplan.json
          python3 ../../ci/guard_terraform_plan.py tfplan.json

      - name: terraform apply
        if: steps.plan.outputs.changes == 'true'
        run: terraform apply -input=false -no-color tfplan

      - name: Export outputs
        id: outputs
        run: |
          terraform output -json > outputs.json
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          o = json.load(open("outputs.json"))
          for k in ("logs_bucket_name", "reasoning_engine_name", "reasoning_engine_id"):
              if k in o:
                  print(f"{k}={o[k]['value']}")
          EOF

      - name: Verify engine consistency
        env:
          STATE_ENGINE: ${{ steps.outputs.outputs.reasoning_engine_name }}
        run: |
          python3 ../../ci/check_engine_consistency.py \
            --tfvars vars/env.tfvars \
            --metadata ../../../agents/starter_agent/deployment_metadata.json \
            --state-engine "${STATE_ENGINE}"

  tests:
    name: tests
    permissions:
      contents: read
      id-token: write
    needs: [changes, terraform-apply]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID || 'your-gcp-project-id' }}
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
      APP_BQ_DATASET: ${{ vars.APP_BQ_DATASET || 'agent_data_sharing' }}
      APP_BQ_LOCATION: ${{ vars.GCP_REGION || 'us-central1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (CI Read-Only Identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT || vars.CI_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install dependencies
        run: uv sync

      - name: Preflight BigQuery check
        run: uv run python tests/ci/preflight_bq_access.py

      - name: Run unit test suite
        run: uv run pytest tests/unit -v

      - name: Run integration test suite
        run: uv run pytest tests/integration -v

  evals:
    name: evals
    permissions:
      contents: read
      id-token: write
    needs: [changes, terraform-apply, tests]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID || 'your-gcp-project-id' }}
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
      APP_BQ_DATASET: ${{ vars.APP_BQ_DATASET || 'agent_data_sharing' }}
      APP_BQ_LOCATION: ${{ vars.GCP_REGION || 'us-central1' }}
      EVAL_MIN_MEAN_RESPONSE_QUALITY: ${{ vars.EVAL_MIN_MEAN_RESPONSE_QUALITY || '3.5' }}
      EVAL_MIN_CASE_RESPONSE_QUALITY: ${{ vars.EVAL_MIN_CASE_RESPONSE_QUALITY || '2.0' }}
      EVAL_MIN_TOOL_GROUNDING_RATE: ${{ vars.EVAL_MIN_TOOL_GROUNDING_RATE || '1.0' }}
      EVAL_MIN_POLICY_COMPLIANCE_RATE: ${{ vars.EVAL_MIN_POLICY_COMPLIANCE_RATE || '1.0' }}
      EVAL_MAX_ERRORED_CASES: ${{ vars.EVAL_MAX_ERRORED_CASES || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (CI Read-Only Identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT || vars.CI_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install dependencies (with eval extras)
        run: uv sync --extra eval

      - name: Run agent evaluations (agents-cli eval run)
        run: |
          mkdir -p artifacts/grade_results
          uvx google-agents-cli@${AGENTS_CLI_VERSION} eval run \
            --output artifacts/grade_results \
            --concurrency 4

      - name: Enforce quality and release thresholds
        run: python tests/eval/check_thresholds.py --results-dir artifacts/grade_results

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-evals-release-${{ github.sha }}
          path: |
            artifacts/grade_results/
            artifacts/traces/
          if-no-files-found: warn
          retention-days: 90

  deploy:
    name: deploy
    permissions:
      contents: read
      id-token: write
    needs: [changes, terraform-apply, evals]
    if: ${{ !cancelled() && !failure() && !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      LOGS_BUCKET_NAME: ${{ needs.terraform-apply.outputs.logs_bucket_name }}
      EXPECTED_ENGINE: ${{ needs.terraform-apply.outputs.reasoning_engine_name }}
      GEMINI_AUTHORIZATION_ID: ${{ vars.GEMINI_AUTHORIZATION_ID }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://my-agent.example.com' }}
      AGENT_ROUTER_MODEL: ${{ vars.AGENT_ROUTER_MODEL || 'gemini-2.5-flash' }}
      AGENT_CORE_MODEL: ${{ vars.AGENT_CORE_MODEL || 'gemini-2.5-pro' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (Deployer Identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT || vars.DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: 'beta'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Deploy in-place to Agent Runtime (agents-cli deploy)
        run: |
          ENV_VARS="GOOGLE_CLOUD_LOCATION=global"
          ENV_VARS="$ENV_VARS,GOOGLE_GENAI_USE_VERTEXAI=TRUE"
          ENV_VARS="$ENV_VARS,AGENT_ROUTER_MODEL=${AGENT_ROUTER_MODEL}"
          ENV_VARS="$ENV_VARS,AGENT_CORE_MODEL=${AGENT_CORE_MODEL}"
          ENV_VARS="$ENV_VARS,FRONTEND_URL=${FRONTEND_URL}"
          ENV_VARS="$ENV_VARS,APP_BQ_DATASET=${APP_BQ_DATASET:-agent_data_sharing}"
          ENV_VARS="$ENV_VARS,APP_BQ_LOCATION=${GCP_REGION}"
          ENV_VARS="$ENV_VARS,OTEL_SERVICE_NAME=my-agent-service"
          ENV_VARS="$ENV_VARS,OTEL_RESOURCE_ATTRIBUTES=service.version=${GITHUB_SHA}"

          cd agents/starter_agent
          uvx google-agents-cli@${AGENTS_CLI_VERSION} deploy \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --no-confirm-project \
            --update-env-vars="${ENV_VARS}"

      - name: Verify engine consistency
        run: |
          python3 deployment/ci/check_engine_consistency.py \
            --tfvars deployment/terraform/single-project/vars/env.tfvars \
            --metadata agents/starter_agent/deployment_metadata.json \
            --state-engine "${EXPECTED_ENGINE}"

      - name: Smoke test against deployed engine (30s Locust load test)
        run: |
          _AUTH_TOKEN=$(gcloud auth print-access-token -q)
          echo "::add-mask::${_AUTH_TOKEN}"
          export _AUTH_TOKEN
          mkdir -p tests/load_test/.results
          uvx locust==${LOCUST_VERSION} \
            -f tests/load_test/load_test.py \
            --headless \
            -t 30s -u 2 -r 0.5 \
            --csv=tests/load_test/.results/results \
            --html=tests/load_test/.results/report.html

      - name: Export smoke test results to GCS
        if: always() && env.LOGS_BUCKET_NAME != ''
        run: |
          DEST="gs://${LOGS_BUCKET_NAME}/load-test-results/${GITHUB_SHA}-$(date +%Y%m%d-%H%M%S)"
          gcloud storage cp --recursive tests/load_test/.results "${DEST}" --quiet || true
          echo "Smoke test results: https://console.cloud.google.com/storage/browser/${DEST#gs://}" >> "$GITHUB_STEP_SUMMARY"

  publish-gemini-enterprise:
    name: publish-gemini-enterprise
    permissions:
      contents: read
      id-token: write
    needs: deploy
    if: ${{ vars.GEMINI_ENTERPRISE_APP_ID != '' && !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GEMINI_APP_ID: ${{ vars.GEMINI_ENTERPRISE_APP_ID }}
      GEMINI_AUTHORIZATION_ID: ${{ vars.GEMINI_AUTHORIZATION_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      AGENT_DISPLAY_NAME: "${{ vars.GEMINI_ENTERPRISE_AGENT_DISPLAY_NAME || 'Enterprise AI Agent' }}"
      AGENT_DESCRIPTION: "${{ vars.GEMINI_ENTERPRISE_AGENT_DESCRIPTION || 'Enterprise agentic assistant with row-level security and tools integration.' }}"
      AGENT_TOOL_DESCRIPTION: "${{ vars.GEMINI_ENTERPRISE_AGENT_TOOL_DESCRIPTION || 'Answers user queries grounded in corporate BigQuery lakehouse datasets.' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (Deployer Identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT || vars.DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Register engine in Gemini Enterprise (agents-cli publish)
        run: |
          AUTH_ARGS=()
          if [ -n "${GEMINI_AUTHORIZATION_ID:-}" ]; then
            AUTH_ARGS=(--authorization-id "${GEMINI_AUTHORIZATION_ID}")
          fi
          cd agents/starter_agent
          uvx google-agents-cli@${AGENTS_CLI_VERSION} publish gemini-enterprise \
            --gemini-app-id "${GEMINI_APP_ID}" \
            --registration-type adk \
            --deployment-target agent_runtime \
            --project "${GCP_PROJECT_ID}" \
            --project-number "${GCP_PROJECT_NUMBER}" \
            --display-name "${AGENT_DISPLAY_NAME}" \
            --description "${AGENT_DESCRIPTION}" \
            --tool-description "${AGENT_TOOL_DESCRIPTION}" \
            "${AUTH_ARGS[@]}"

      - name: Ensure OAuth & ALL_USERS sharing configuration
        run: |
          uv sync
          uv run python deployment/register_ge_oauth.py --ensure-agent-sharing

  deploy-frontend:
    name: deploy-frontend
    permissions:
      contents: read
      id-token: write
    needs: [changes, terraform-apply]
    if: ${{ !cancelled() && !failure() && !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') && vars.FRONTEND_IMAGE_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      FRONTEND_SERVICE: ${{ vars.FRONTEND_SERVICE || 'my-agent-frontend' }}
      FRONTEND_IMAGE_REPOSITORY: ${{ vars.FRONTEND_IMAGE_REPOSITORY }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (Deployer Identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT || vars.DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push container image
        run: |
          set -euo pipefail
          registry_host="${FRONTEND_IMAGE_REPOSITORY%%/*}"
          gcloud auth configure-docker "${registry_host}" --quiet
          image="${FRONTEND_IMAGE_REPOSITORY}/${FRONTEND_SERVICE}"
          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${image}:${GITHUB_SHA}" -t "${image}:latest" frontend/
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
          echo "IMAGE=${image}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Deploy revision to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --image "${IMAGE}" \
            --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" \
            --labels "commit-sha=${GITHUB_SHA}" \
            --quiet
          ready="$(gcloud run services describe "${FRONTEND_SERVICE}" --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" \
            --format='value(status.conditions[0].status)')"
          [ "${ready}" = "True" ] || { echo "::error::service not Ready after deploy"; exit 1; }

      - name: Smoke check frontend HTTPS endpoint
        if: env.FRONTEND_URL != ''
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${FRONTEND_URL}")"
          echo "GET ${FRONTEND_URL} -> ${code}"
          case "${code}" in 200|302) ;; *) echo "::error::unexpected status ${code} from frontend"; exit 1;; esac
